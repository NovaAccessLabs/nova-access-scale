name: CI

# Static analysis + tests on every push to main and every PR. Fast (Dart-only,
# no Android toolchain needed for analyze/test), so it gates regressions
# before they land. Release/signing is done locally — see DEVELOPMENT.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n/generated \
            || (echo "::error::Generated l10n is stale. Run 'flutter gen-l10n' and commit." && exit 1)

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
